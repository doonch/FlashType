<!DOCTYPE html>
<html>
<head>
<title>FlashType</title>
<meta name="description" content="Language-learning flashcard tool where you type answers with instant feedback and lesson sets">
<meta property="og:title" content="FlashType">
<meta property="og:description" content="Language-learning flashcard tool where you type answers with instant feedback and lesson sets">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" type="text/css" href="style.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js">
</script>
<script src="data.js"></script>
<script src="utils.js">
</script>
<script>
$(document).ready(function(){
    $("#list").hide();
    $("#startbutton").hide();
    $("#stage").hide();
    $("#vocabTable").hide();
    applySettings();

    $("#lesson").change(function(){
        var lessonIdx = $("#lesson")[0].value;
        $("#stage").hide();
        clearPassiveTimers();
        if (lessonIdx == "0")
        {
            $("#startbutton").hide();
        }
        else
        {
            $("#list").load(lessonFiles[lessonIdx].file, function() {
                presentYtping = (appSettings.romanization === "yale");
            });
            presentYtping = (appSettings.romanization === "yale");
            linkToDictionary=lessonFiles[lessonIdx].linkToDictionary;
            $("#startbutton").show();
        }
    });
    $("#startbutton").click(function() {
        var raw = $("#list").text() || $("#list")[0].innerHTML;
        lines = raw.split(/\r?\n/);
        lines = $.grep(lines, function (s) { return s.trim().split(":").length >= 2; });
        seen = new set(lines.length);
        presentYtping = (appSettings.romanization === "yale");
        $("#stage").show();
        updatePassiveModeUI();
        showNext();
        updateList(lines);
    });
    populateLessons();

    if (typeof QueryString.lessonId === "undefined") {
        // Do nothing
    } else {
        var lessonIdx = QueryString.lessonId;
        $("#lesson")[0].value = lessonIdx;
        $("#list").load(lessonFiles[lessonIdx].file, function() {
            presentYtping = (appSettings.romanization === "yale");
        });
        presentYtping = (appSettings.romanization === "yale");
        linkToDictionary=lessonFiles[lessonIdx].linkToDictionary;
        $("#startbutton").show();
        // $("#lesson")[0].trigger("change"); // Doesn't work as expected
    }
    if (typeof QueryString.forgiveTones === "undefined") {
    } else {
        forgiveTones=true;
    }
});
</script>
</head>
<body>
<button type="button" id="settings_btn" title="Settings" aria-label="Settings" onclick="openSettingsModal()">⚙</button>

<div id="settings_modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="settings_title">
    <div class="settings-modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="settings_title">⚙ Settings</h3>
            <button type="button" class="modal-close-btn" onclick="closeSettingsModal()" aria-label="Close settings">&times;</button>
        </div>
        <div class="modal-body">
            <div class="setting-section">
                <span class="setting-section-title">Romanization</span>
                <div class="setting-radio-group">
                    <label class="setting-radio-label">
                        <input type="radio" name="romanization_pref" value="jyutping" id="rom_jyutping" onchange="onSettingChange()">
                        <span>Jyutping</span>
                    </label>
                    <label class="setting-radio-label">
                        <input type="radio" name="romanization_pref" value="yale" id="rom_yale" onchange="onSettingChange()">
                        <span>Yale</span>
                    </label>
                </div>
            </div>

            <div class="setting-section">
                <span class="setting-section-title">Audio & Speech</span>
                <label class="setting-checkbox-label">
                    <input type="checkbox" id="setting_speak_questions" onchange="onSettingChange()">
                    <span>Speak out questions</span>
                </label>
                <div class="setting-desc">Automatically read questions aloud when presented</div>

                <label class="setting-checkbox-label" style="margin-top: 4px;">
                    <input type="checkbox" id="setting_speak_answers" onchange="onSettingChange()">
                    <span>Speak out answers</span>
                </label>
                <div class="setting-desc">Automatically read answers aloud when revealed</div>
            </div>

            <div class="setting-section">
                <span class="setting-section-title">Practice Mode</span>
                <label class="setting-checkbox-label">
                    <input type="checkbox" id="setting_passive_mode" onchange="onSettingChange()">
                    <span>Enable Passive Mode</span>
                </label>
                <div class="setting-desc">Hands-free mode: auto-reveals answers and loads next question</div>

                <div id="passive_time_options" class="setting-suboptions" style="display: none;">
                    <div class="setting-timeout-row">
                        <label for="setting_q_timeout">Question delay:</label>
                        <span><input type="number" id="setting_q_timeout" min="1" max="20" step="0.5" value="3.5" class="setting-timeout-input" onchange="onSettingChange()"> s</span>
                    </div>
                    <div class="setting-timeout-row">
                        <label for="setting_d_timeout">Answer decay delay:</label>
                        <span><input type="number" id="setting_d_timeout" min="0.5" max="20" step="0.5" value="2.5" class="setting-timeout-input" onchange="onSettingChange()"> s</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="modal-btn-primary" onclick="closeSettingsModal()">Done</button>
        </div>
    </div>
</div>

<select name="lesson" id="lesson">
</select>
<br/>
<button type="button" id="startbutton">Start</button>
<div id=stage>
Q: <span id="question_txt">Ready?</span><br/>
<div id="interactive_controls">
A: <input type="text" id="answer" size="50" onkeyup="checkPress(event)">
<button type="button" onclick="checkAnswer()">Submit</button>
<button type="button" onclick="skip()">Skip</button><br/>
</div>
<div id="passive_indicator" style="display: none; margin: 8px 0 10px 0;">
    <span class="passive-badge">Passive Mode</span>
    <span id="passive_status" class="passive-status">Thinking...</span>
</div>
<div id="feedback"></div>
<div id="list">new:san1
old (not young):lou5</div>
<button id="toggleTable" type="button" onclick="toggleTable()">Show List</button></br>
<br/>
<table id="vocabTable" border="1">
</table>
</div>
<audio id="aud_question"><source src="audio/file.wav" type="audio/wav"></audio>
<audio id="aud_answer"><source src="audio/file.wav" type="audio/wav"></audio>
</body>
</html>
